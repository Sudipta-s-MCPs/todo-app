version: '3.9'

services:
  backend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-backend:latest
    ports:
      - "5482:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - API_V1_PREFIX=${API_V1_PREFIX}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION}
      - ADMIN_USERS=${ADMIN_USERS}
      - TEST_API_KEY=${TEST_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    networks:
      - smart-todo-network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  frontend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-frontend:latest
    ports:
      - "5484:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    networks:
      - smart-todo-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-panel:
    image: ghcr.io/sudipta-s-mcps/smart-todo-admin:latest
    ports:
      - "5483:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    networks:
      - smart-todo-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp-server:
    image: ghcr.io/sudipta-s-mcps/smart-todo-mcp:latest
    ports:
      - "5485:5485"
    environment:
      - TODO_API_ENDPOINT=${TODO_API_ENDPOINT}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION}
      - PYTHONPATH=${PYTHONPATH}
    restart: unless-stopped
    networks:
      - smart-todo-network
    depends_on:
      - backend
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5485/mcp/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

networks:
  smart-todo-network:
    driver: bridge