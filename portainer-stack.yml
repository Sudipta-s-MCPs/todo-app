version: '3.9'

services:
  backend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-backend:latest
    ports:
      - "5482:8000"
    environment:
      # Core Infrastructure
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://sd_todo_app_user:AAqLX5r0lzm53hgQu48XIClw@192.168.11.100:15432/sd_todo_app_db
      - REDIS_URL=redis://192.168.11.100:6379/0
      - SECRET_KEY=qU0kgMpWIkaZkrX2SYbxmRjfv8KJEho0V9u5u6kXAiTx2ecEo7KgXZtwx
      - ALGORITHM=HS256
      
      # API Configuration
      - API_V1_PREFIX=/api/v1
      - API_BASE_URL=http://192.168.11.100:5482
      - CORS_ORIGINS=["http://192.168.11.100:5483", "http://192.168.11.100:5484", "http://192.168.11.100:5482", "https://192.168.11.100:5483", "https://192.168.11.100:5484", "https://192.168.11.100:5482"]
      
      # MCP Configuration
      - MCP_SERVER_NAME=TodoApp
      - MCP_SERVER_VERSION=1.0.0
      
      # Admin Configuration
      - ADMIN_USERS=["sudiptai26.889@gmail.com"]
      
      # Test Configuration
      - TEST_API_KEY=v99KUrYXhQAMTRg41JTG203cPGi30ajCWhRmfmLzfC4F2wJsujDH
      
      # Monitoring
      - LOG_LEVEL=INFO
    networks:
      - todo-app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-frontend:latest
    ports:
      - "5484:80"
    environment:
      - VITE_API_URL=http://192.168.11.100:5482/api/v1
    networks:
      - todo-app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-panel:
    image: ghcr.io/sudipta-s-mcps/smart-todo-admin:latest
    ports:
      - "5483:80"
    environment:
      - VITE_API_URL=http://192.168.11.100:5482/api/v1
    networks:
      - todo-app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp-server:
    image: ghcr.io/sudipta-s-mcps/smart-todo-mcp:latest
    ports:
      - "5485:5485"
    environment:
      - TODO_API_ENDPOINT=http://192.168.11.100:5482/api/v1
      - MCP_SERVER_NAME=TodoApp
      - MCP_SERVER_VERSION=1.0.0
      - PYTHONPATH=/app
      # MCP Authentication - These will be passed from Claude Desktop
      - TODO_API_KEY=${TODO_API_KEY:-}
      - TODO_USER_ID=${TODO_USER_ID:-}
      - TODO_DEVICE_ID=${TODO_DEVICE_ID:-}
      - TODO_DEVICE_NAME=${TODO_DEVICE_NAME:-Claude Desktop}
    networks:
      - todo-app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5485/mcp/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  todo-app-net:
    external: true
# Note: This stack uses external PostgreSQL and Redis running on the Synology NAS
# Make sure the following services are running on your NAS:
# - PostgreSQL on port 15432 with database 'sd_todo_app_db'
# - Redis on port 6379
# 
# To deploy:
# 1. Copy this file to your Portainer stacks
# 2. Update IP addresses if different from 192.168.11.100
# 3. Update environment variables as needed
# 4. Deploy the stack