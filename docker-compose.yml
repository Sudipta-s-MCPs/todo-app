version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-todo-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./backend:/app
    networks:
      - smart-todo-network
    depends_on:
      - redis-cache
    restart: unless-stopped

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: smart-todo-admin
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${API_BASE_URL}
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    networks:
      - smart-todo-network
    depends_on:
      - backend
    restart: unless-stopped

  test-client:
    build:
      context: ./test-client
      dockerfile: Dockerfile
    container_name: smart-todo-test-client
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - TEST_API_KEY=${TEST_API_KEY}
    volumes:
      - ./test-client:/app
    networks:
      - smart-todo-network
    depends_on:
      - backend
    profiles:
      - test

  # Local Redis cache for development
  # In production on Synology NAS, this service won't be used
  redis-cache:
    image: redis:7-alpine
    container_name: smart-todo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smart-todo-network
    restart: unless-stopped
    profiles:
      - local

networks:
  smart-todo-network:
    driver: bridge

volumes:
  redis-data: