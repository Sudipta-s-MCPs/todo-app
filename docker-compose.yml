services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-todo-backend
    ports:
      - "${BACKEND_PORT:-5482}:8000"
    environment:
      # Core Infrastructure - Must remain in env
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      
      # API Configuration
      - API_V1_PREFIX=${API_V1_PREFIX}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      # MCP Configuration
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION}
      
      # Admin Configuration
      - ADMIN_USERS=${ADMIN_USERS}
      
      # Test Configuration
      - TEST_API_KEY=${TEST_API_KEY}
      
      # Monitoring
      - LOG_LEVEL=${LOG_LEVEL}
      
      # Note: All other settings are now managed via admin panel at /settings
    volumes:
      - ./backend:/app
    networks:
      - smart-todo-network
    restart: unless-stopped

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_BASE_URL}/api/v1
    container_name: smart-todo-admin
    ports:
      - "${ADMIN_PORT:-5483}:3000"
    environment:
      - VITE_API_URL=${API_BASE_URL}/api/v1
    # volumes:
    #   - ./admin-panel:/app
    #   - /app/node_modules
    networks:
      - smart-todo-network
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-todo-frontend
    ports:
      - "${FRONTEND_PORT:-5484}:80"
    environment:
      - VITE_API_URL=${API_BASE_URL}/api/v1
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    networks:
      - smart-todo-network
    depends_on:
      - backend
    restart: unless-stopped

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-todo-mcp-server
    ports:
      - "${MCP_PORT:-5485}:5485"
    environment:
      - TODO_API_KEY=sk_todo_dXUp4PpVrpoSHUaN28CQMKJXGuNJZs7vCiTcmxAX
      - TODO_DEVICE_ID=mcp_K0YxB7lyqgjOZLTv
      - TODO_DEVICE_NAME=Smart-ToDo MCP Server
      - TODO_API_ENDPOINT=http://backend:8000/api/v1
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-TodoApp}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION:-1.0.0}
      - PYTHONPATH=/app
    command: ["sh", "-c", "cd /app && python -m mcp_server.server"]
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    networks:
      - smart-todo-network
    restart: unless-stopped

networks:
  smart-todo-network:
    driver: bridge