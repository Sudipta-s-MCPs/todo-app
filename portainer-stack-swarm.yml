version: '3.9'

services:
  backend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-backend:latest
    ports:
      - "5482:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - API_V1_PREFIX=${API_V1_PREFIX}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION}
      - ADMIN_USERS=${ADMIN_USERS}
      - TEST_API_KEY=${TEST_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/sudipta-s-mcps/smart-todo-frontend:latest
    ports:
      - "5484:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin-panel:
    image: ghcr.io/sudipta-s-mcps/smart-todo-admin:latest
    ports:
      - "5483:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp-server:
    image: ghcr.io/sudipta-s-mcps/smart-todo-mcp:latest
    ports:
      - "5485:5485"
    environment:
      - TODO_API_ENDPOINT=${TODO_API_ENDPOINT}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION}
      - PYTHONPATH=${PYTHONPATH}
      # MCP Authentication - These will be passed from Claude Desktop
      - TODO_API_KEY=${TODO_API_KEY:-}
      - TODO_USER_ID=${TODO_USER_ID:-}
      - TODO_DEVICE_ID=${TODO_DEVICE_ID:-}
      - TODO_DEVICE_NAME=${TODO_DEVICE_NAME:-Claude Desktop}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5485/mcp/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Note: This stack uses external PostgreSQL and Redis running on the Synology NAS
# Make sure the following services are running on your NAS:
# - PostgreSQL on port 15432 with database 'sd_todo_app_db'
# - Redis on port 6379
# 
# To deploy:
# 1. Copy this file to your Portainer stacks
# 2. Update IP addresses if different from 192.168.11.108
# 3. Update environment variables as needed
# 4. Deploy the stack